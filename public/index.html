<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nocera Gifts Counter</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="wrap top-in">
    <div class="brand"><img src="/logo.png" alt="Nocera Gifts" width="134" height="44"><small>Counter</small></div>
    <nav class="tabs" aria-label="Sections">
      <button data-view="sell" aria-current="page">Sell</button>
      <button data-view="products">Products</button>
      <button data-view="sales">Sales</button>
      <button data-view="settings" data-owner>Settings</button>
    </nav>
    <div class="who"><span class="nm" id="whoName"></span><button class="btn" data-act="lock">Lock</button></div>
  </div>
</header>
<div class="wrap"><div id="banner"></div></div>
<main class="wrap" id="app"></main>
<div id="layer"></div>
<script src="/app.js" defer></script>
</body>
</html>
